server {
    listen 80;
    server_name _;
    client_max_body_size 2048M;   # allow large CCTV uploads

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + thumbnails to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
    location /thumbnails/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
